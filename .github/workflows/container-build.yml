name: IaC scanner container smoke test

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "iac_secret_scanner.py"
      - ".github/workflows/container-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "iac_secret_scanner.py"
      - ".github/workflows/container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build container image
        run: docker build --pull -t local/escaner-iac:ci .
      - name: Run scanner against an empty directory
        run: |
          mkdir -p empty-fixture
          docker run --rm -v "$PWD/empty-fixture:/workspace:ro" local/escaner-iac:ci /workspace
